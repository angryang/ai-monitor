# ai-monitor · example runtime config
#
# Layer order: defaults < this file < env (AI_MONITOR_*) < --flag
# Restart required after edit; per-task CRUD goes through /admin or sqlite.

sqlite_path: ai-monitor.db
http_addr: ":9090"

max_concurrent: 16
jitter: 250ms

# Alerting
slow_threshold: 10s
consec_failure_n: 3
success_rate_window: 200
success_rate_threshold: 0.8
dedup_ttl: 5m

# TLS certificate verification.
#
# false (default) = verify upstream certs normally.
# true             = skip verification for EVERY probe (self-signed / private CA).
#                   ⚠️ removes MITM protection — prefer the per-task
#                   `insecure_skip_verify` below, which scopes the exemption
#                   to a single endpoint.
insecure_skip_verify: false

# AI service provider registry.
#
# A provider is only persisted after the upstream accepted a request with
# its own credentials and model. This bounds how long that check may take
# — it also bounds how long the admin API holds the save request open.
provider_check_timeout: 10s

# Buckets (per design.md §11.6.1)
buckets_default: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30]
buckets_ttft:    [0.01, 0.025, 0.05, 0.1, 0.2, 0.35, 0.5, 0.75, 1, 2, 5]
buckets_itl:     [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5]
buckets_duration: [0.1, 0.25, 0.5, 1, 2.5, 5, 10, 20, 30, 60, 120]
buckets_lag:     [0.01, 0.05, 0.1, 0.5, 1, 5, 30, 60]

# Example monitoring task.
#
# A task names the AI service provider it probes; the upstream coordinates
# (protocol, base URL, api key, model, timeout, TLS / thinking switches)
# live on the provider — see the 「AI 服务商」 page or /admin/providers.
# The api key never belongs in this file: it is sealed with the instance
# master key and stored in SQLite.
#
# Tasks are normally created through the admin API (POST /admin/tasks);
# this block only documents the shape.
tasks:
  - name: prod-openai-gpt4o
    enabled: true
    provider_id: "" # <- ai_providers.id
    schedule: "*/30 * * * * *"
    user_prompt: "Say hi at ${today}"
    prompt_vars:
      today: "{{.Now.Date}}"
    canary_group: default
    notify:
      enabled: false
      channel: wecom
      wecom_webhook: ${WECOM_WEBHOOK}
